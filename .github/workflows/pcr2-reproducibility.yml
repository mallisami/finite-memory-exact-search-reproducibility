name: PCR2 reproducibility verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: bash verify.sh
      - run: bash run_tests.sh
      - name: Independently rebuild five retained-data publication figures
        run: python src/analysis/rebuild_publication_figures.py
